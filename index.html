<script>
// 依瀏覽器語言分流：中文 → 繁中版，其餘 → 英文版
(function(){
  var langs = navigator.languages || [navigator.language || 'en'];
  var zh = langs.some(function(l){ return /^zh/i.test(l); });
  location.replace(zh ? 'zh-Hant/' : 'en/');
})();
</script>
